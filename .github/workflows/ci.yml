# Every push and pull request: the frontend's tests, lint and build, and the
# backend built with its tests. A v* tag additionally builds the three images
# and publishes them to Docker Hub -- when DOCKERHUB_USERNAME and
# DOCKERHUB_TOKEN are set as repository secrets; without them that job is a
# no-op rather than a failure.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake git libpq-dev libssl-dev zlib1g-dev libjsoncpp-dev uuid-dev
      # Drogon is cloned and built by FetchContent; keep that between runs.
      - uses: actions/cache@v4
        with:
          path: backend/build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('backend/CMakeLists.txt') }}
      - run: cmake -S backend -B backend/build -DCMAKE_BUILD_TYPE=Release -DJAMILLION_BUILD_TESTS=ON
      - run: cmake --build backend/build -j "$(nproc)"
      - run: ctest --test-dir backend/build --output-on-failure

  images:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - if: env.DOCKERHUB_TOKEN == ''
        run: echo "::warning::DOCKERHUB_TOKEN is not set, images not published"
      - if: env.DOCKERHUB_TOKEN != ''
        uses: actions/checkout@v4
      - if: env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - if: env.DOCKERHUB_TOKEN != ''
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          JAMILLION_VERSION="$VERSION" docker compose -f compose.yaml -f compose.build.yaml build
          for img in backend db web; do
            docker tag "en1y/jamillion-$img:$VERSION" "en1y/jamillion-$img:latest"
            docker push "en1y/jamillion-$img:$VERSION"
            docker push "en1y/jamillion-$img:latest"
          done
